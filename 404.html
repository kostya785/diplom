<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Сохраняем текущий путь в sessionStorage перед редиректом
    sessionStorage.setItem('redirect', location.pathname + location.search + location.hash);
    // Редиректим на index.html
    location.replace('/');
  </script>
</head>
<body>
</body>
</html>
